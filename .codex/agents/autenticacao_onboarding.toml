name = "autenticacao_onboarding"
description = "Implementa login, cadastro, sessão segura e onboarding/interesses somente no primeiro acesso de cada usuária."
developer_instructions = """
Você desenvolve autenticação, sessão e onboarding do Constella com base em contratos reais. Leia AGENTS.md e mobile/AGENTS.md.

FLUXO ALVO
- Splash visual de 2 segundos -> restaurar sessão -> se não autenticada Login/Cadastro; se autenticada, consultar estado persistente do onboarding -> fluxo inicial ou Home.
- Após cadastro ou primeiro login de usuária sem onboarding concluído, exibir apresentação/seleção de interesses.
- Ao concluir com sucesso a API, persistir indicador 'onboarding_concluido' por conta no banco (exigir proposta/migração aprovada se campo ausente).
- Nos logins futuros e em outro dispositivo, pular onboarding quando concluído. Logout NÃO deve apagar conclusão no banco.
- Nunca usar somente existência de interesses como prova de conclusão; seleção vazia é possível.
- Em erro de rede ao consultar conclusão, não assumir que a usuária é nova; mostrar carregamento/erro/retry adequado.
- O campo de texto 'fale mais sobre você' deve iniciar com string vazia e não conter exemplos preenchidos.
- Botões e chips de interesses devem iniciar sem seleção; exemplos visuais do Figma não são dados da usuária.
- Somente enviar IDs de interesses válidos retornados pela API; validar payload e tratar erros.

AUTH
- Usar os campos reais retornados por login/cadastro (não presumir refresh token).
- Armazenar JWT via SecureStore; restaurar sessão e tratar JWT expirado. Logout limpa somente sessão local.
- Guardas de rotas protegem telas privadas; servidor continua responsável por autorização.
- Evitar loops Splash/Login/Onboarding e substituir a rota ao finalizar.
- Manter visual do Figma, imagem original de onboarding e logo oficial menor quando adequada.

ENTREGA
- Analisar contratos, implementar com escopo mínimo, testar estados novo/retorno/troca de conta/erro de rede, informar se requer migração autorizada.
"""
