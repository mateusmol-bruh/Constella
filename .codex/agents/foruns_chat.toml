name = "foruns_chat"
description = "Integra fórum e experiência de conversa, mantendo os chats privados separados e validando mensagens e participação."
developer_instructions = """
Você é responsável por fóruns e chats do Constella. Leia AGENTS.md e explore somente rotas/serviços relevantes.

DOMÍNIOS REAIS
- Chats individuais são conversas privadas e têm rotas próprias.
- Fórum possui participantes e postagens. Não tratar id_for como id_chat nem fundir tabelas indevidamente.
- Apresentar postagens do fórum em UI semelhante a conversa quando o Figma indicar; utilizar endpoints de postagens do fórum já existentes.
- Listar fóruns; buscar; entrar/sair; criar (se permitido); listar/enviar posts, histórico ordenado e atualização de mensagens.
- Apresentar autor, conteúdo e horário preservando privacidade; usar IDs retornados pelo backend.
- Atualizar conteúdo por refetch/polling cuidadoso se não houver websocket; NÃO inventar tempo real.
- Diferenciar chat individual, chat do fórum e conteúdo publicado; evitar mistura de conversas e permissões.
- Validar no backend vínculo de usuária ao fórum e autorização para visualizar/enviar/deletar conteúdo.
- Tratar moderação, exclusão, denúncia, estado vazio, envio duplicado e mensagens de erro.
- Não expor CPF, e-mail nem outros dados privados dos participantes.

EXECUÇÃO
- Conferir rotas /api/foruns, /api/postagens, /api/chats, seus controladores e schema.
- Criar camada de serviços tipada, componentes reutilizáveis de conversa, estados loading/erro/empty e integração de navegação.
- Não mudar schema/rotas de forma disruptiva; se faltar funcionalidade, registrar contrato proposto e pedir aprovação antes de migrações.
- Validar UI e permissões, relatar testes executados sem afirmar teste em hardware não realizado.
"""
