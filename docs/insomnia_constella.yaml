spec:
  contents:
    openapi: 3.0.3
    info:
      title: Constella API
      version: 1.0.0
      description: >-
        Documentação/importação da API backend do projeto Constella.


        Base local: http://localhost:3000


        A maioria das rotas usa JWT Bearer de usuária. As rotas de
        /api/moderacao, exceto /login, usam o JWT de moderadora.
    servers:
      - url: http://localhost:3000
        description: Servidor local
    tags:
      - name: Autenticação
      - name: Perfil
      - name: Interesses
      - name: Usuárias
      - name: Conexões
      - name: Chats
      - name: Fóruns
      - name: Postagens
      - name: Denúncias
      - name: Moderação
      - name: Conteúdos
      - name: Pro
      - name: Assinatura
      - name: Recomendações
    paths:
      /:
        get:
          summary: Verificar se a API está online
          tags:
            - Autenticação
          responses:
            "200":
              description: API online
              content:
                application/json:
                  example:
                    mensagem: API Constella funcionando!
      /api/auth/cadastro:
        post:
          summary: Cadastrar usuária
          tags:
            - Autenticação
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - nome
                    - email
                    - senha
                    - cpf
                  properties:
                    nome:
                      type: string
                      maxLength: 255
                    email:
                      type: string
                      format: email
                      maxLength: 255
                    senha:
                      type: string
                      minLength: 8
                    cpf:
                      type: string
                      description: CPF com 11 dígitos ou formatado
                example:
                  nome: Maria Silva
                  email: maria@email.com
                  senha: Senha@123
                  cpf: "52998224725"
          responses:
            "201":
              description: Usuária cadastrada
              content:
                application/json:
                  example:
                    mensagem: Usuária cadastrada com sucesso!
                    token: JWT_AQUI
                    usuaria:
                      id: "1"
                      nome: Maria Silva
                      email: maria@email.com
                      status_verificacao: false
                    proxima_etapa: interesses
            "400":
              description: Dados inválidos
            "409":
              description: E-mail ou CPF já cadastrado
            "429":
              description: Muitas tentativas
            "500":
              description: Erro interno
      /api/auth/login:
        post:
          summary: Login da usuária
          tags:
            - Autenticação
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - email
                    - senha
                  properties:
                    email:
                      type: string
                      format: email
                    senha:
                      type: string
                example:
                  email: maria@email.com
                  senha: Senha@123
          responses:
            "200":
              description: Login realizado
              content:
                application/json:
                  example:
                    mensagem: Login realizado com sucesso
                    token: JWT_AQUI
                    usuaria:
                      id: "1"
                      nome: Maria Silva
                      email: maria@email.com
            "400":
              description: Campos obrigatórios ausentes
            "401":
              description: Credenciais inválidas
            "429":
              description: Muitas tentativas
            "500":
              description: Erro interno
      /api/perfil:
        get:
          summary: Obter meu perfil
          tags:
            - Perfil
          responses:
            "200":
              description: Sucesso
            "400":
              description: Requisição inválida
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Erro"
            "401":
              description: Não autenticado
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Erro"
            "500":
              description: Erro interno
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Erro"
        put:
          summary: Atualizar meu perfil
          tags:
            - Perfil
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    nome:
                      type: string
                      maxLength: 255
                    email:
                      type: string
                      format: email
                      maxLength: 255
                    foto:
                      type: string
                      nullable: true
                      maxLength: 500
                  minProperties: 1
                example:
                  nome: Maria Atualizada
                  foto: https://exemplo.com/foto.jpg
          responses:
            "200":
              description: Sucesso
            "400":
              description: Requisição inválida
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Erro"
            "401":
              description: Não autenticado
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Erro"
            "500":
              description: Erro interno
              content:
                application/json:
